<!DOCTYPE html>
<html lang="uk">
<head>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: 'IBM Plex Sans', sans-serif; color: #e8edf5;
      background:

    }
    main {
      width: 100%; max-width: 420px; text-align: center;
      background: rgba(8,14,20,0.88); border: 1px solid rgba(184,151,90,0.45);
      border-radius: 18px; padding: 32px 28px 26px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.55);
    }
    img { display: block; width: 56px; height: 56px; margin: 0 auto; }
    p.brand {
      font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; letter-spacing: 0.02em;
      text-transform: uppercase; margin: 12px 0 18px; font-size: 1.15rem;
    }
    h1 { font-family: Syne, sans-serif; font-size: 1.45rem; font-weight: 700; margin-bottom: 10px; }
    p.lead { color: #8b9bb4; font-size: 0.92rem; line-height: 1.5; margin-bottom: 22px; }
    a.home {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0 22px; border-radius: 12px; text-decoration: none;
      color: #fff; font-weight: 700;
      background: linear-gradient(90deg, #0b4f3c 0%, #127a58 48%, #1aa56e 100%);
    }
    a.home:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/symbol-dark.svg" alt="" width="56" height="56">
    <p class="brand">TRIP-CONTROL</p>

    <p class="lead">Такої адреси немає. Можливо, посилання застаріло або в ньому друкарська помилка.</p>
